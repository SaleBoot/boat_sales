pid /home/ubuntu/ship-entry-review/pipeline-cache.pid;
error_log /home/ubuntu/ship-entry-review/pipeline-cache-error.log;
events { worker_connections 128; }
http {
    client_body_temp_path /home/ubuntu/ship-entry-review/pipeline-client-temp;
    proxy_temp_path /home/ubuntu/ship-entry-review/pipeline-proxy-temp;
    access_log /home/ubuntu/ship-entry-review/pipeline-cache-access.log;
    proxy_cache_path /home/ubuntu/ship-entry-review/pipeline-cache keys_zone=pipeline_qa:10m max_size=100m inactive=1h;
    server {
        listen 127.0.0.1:19188;
        location / {
            proxy_pass http://127.0.0.1:19061;
            proxy_cache pipeline_qa;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;
            proxy_read_timeout 300s;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
