gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss image/svg+xml;

proxy_cache_path /srv/ship-platform-model-cache levels=1:2 keys_zone=ship_model_cache:100m max_size=2g inactive=30d use_temp_path=off;

server {
    server_tokens off;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 310m;

    location /.well-known/acme-challenge/ { root /srv/ship-ar/acme; }

    location /vr-content/ {
        proxy_pass http://10.100.100.1:6060;
        proxy_cache ship_model_cache;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_age 300s;
        proxy_cache_lock_timeout 300s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_http_version 1.1;
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_force_ranges on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /FBX/ {
        proxy_cache ship_model_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_age 300s;
        proxy_cache_lock_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_force_ranges on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_pass http://10.100.100.1:6060;
    }

    location /api/vr/screen/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://10.100.100.1:6060/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /uploads/ {
        proxy_pass http://10.100.100.1:6060/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
