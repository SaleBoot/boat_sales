# Additive HTTPS entry. Keep ship-ar.conf (443) and legacy shipvr.conf (80).
# ship_model_cache is declared by the existing shipvr.conf.
server {
    listen 8443 ssl;
    server_name 1.14.77.78;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/1.14.77.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.14.77.78/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 310m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Independent static release; shared API/identity stays on this origin.
    location = /twin { return 302 /twin/$is_args$args; }
    location /twin/ {
        alias /srv/ship-twin/current/;
        autoindex off;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/vr/screen/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
    location /api/ {
        proxy_pass http://10.100.100.1:6060;
        proxy_cookie_flags ship_session secure httponly samesite=lax;
        add_header Cache-Control no-store always;
    }
    location /uploads/ { proxy_pass http://10.100.100.1:6060; }
    location /FBX/ {
        proxy_pass http://10.100.100.1:6060;
        proxy_cache ship_model_cache;
        proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location /vr-content/ {
        proxy_pass http://10.100.100.1:6060;
        proxy_cache ship_model_cache;
        # Share immutable VR files with the existing HTTP cache.
        proxy_cache_key "http$proxy_host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_age 300s;
        proxy_cache_lock_timeout 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_force_ranges on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
