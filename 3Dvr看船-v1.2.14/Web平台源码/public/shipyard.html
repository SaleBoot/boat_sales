<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>厂家控制台 | 船舶定制系统</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/shipyard.css">
</head>
<body>
  <nav class="top-nav"><div class="nav-inner"><button class="nav-back-btn" onclick="location.href='index.html'">← 返回全部船型</button><div class="shipyard-nav"><button class="identity-trigger" id="identityTrigger"><span class="identity-avatar" id="identityAvatar">厂</span><span id="identityName">加载中…</span><span>⌄</span></button></div></div></nav>
  <aside class="account-popover" id="accountPopover">
    <header><span class="account-avatar" id="popoverAvatar">厂</span><div><strong id="popoverName">加载中…</strong><small id="popoverRole">厂家主账号</small></div></header>
    <div class="account-company" id="popoverCompany"></div>
    <div class="account-membership" id="popoverMembership"><div><span id="popoverPlan">—</span><small id="popoverExpiry">—</small></div><strong><b id="popoverBound">0</b>/<b id="popoverQuota">0</b></strong></div>
    <button data-account-action="profile">我的资料 <span>›</span></button><button id="accountStaffAction" data-account-action="staff">销售管理 <span>›</span></button><button id="accountMembershipAction" data-account-action="membership">会员中心 <span>›</span></button><button data-account-action="password">修改密码 <span>›</span></button><button data-account-action="logout" class="logout-action">退出登录</button>
  </aside>

  <main class="shipyard-shell">
    <section class="shipyard-hero"><div><span class="shipyard-kicker">厂家控制台</span><h1 id="shipyardName">加载中…</h1><p id="roleHint"></p></div><div class="quota-card"><span id="planName">—</span><strong><b id="boundCount">0</b> / <b id="quotaCount">0</b></strong><small>已绑定船型 / 可绑定上限（同船多版本只计1艘）</small><em id="membershipExpiry"></em><div class="quota-track"><i id="quotaBar"></i></div></div></section>
    <div class="shipyard-tabs"><button class="active" data-panel="models">全部船型与模型</button><button id="staffTab" data-panel="staff" hidden>销售管理</button><button id="membershipTab" data-panel="membership" hidden>会员中心</button></div>
    <div id="panel-models" class="shipyard-panel active"><section class="catalog-head"><div><h2>全部已上架船舶模型</h2><p>所有厂家均可浏览；已绑定模型将自动同步到本厂家的PICO账号。</p></div><input id="modelSearch" placeholder="搜索船名、型号或分类"></section><section id="shipyardModels" class="shipyard-grid"><div class="shipyard-empty">正在加载模型…</div></section></div>
    <div id="panel-staff" class="shipyard-panel"><section class="staff-card"><div><h2>新增销售人员</h2><p>销售可以登录网页和PICO，但不能申请绑定、修改厂家资料或管理会员。</p></div><form id="staffForm"><input name="displayName" placeholder="销售姓名" required><input name="username" placeholder="登录账号" required><input name="password" type="password" placeholder="初始密码" required><input name="phone" placeholder="联系电话"><button type="submit">新增销售</button></form></section><section class="staff-card"><div class="catalog-head"><div><h2>销售人员列表</h2><p>主账号可修改姓名和电话、停用、重置密码或删除。</p></div></div><div id="staffList" class="staff-list"><div class="shipyard-empty">正在加载…</div></div></section></div>
    <div id="panel-membership" class="shipyard-panel"><section class="membership-center"><div class="catalog-head"><div><h2>会员等级</h2><p>暂不接入在线支付；提交申请后由平台线下联系并审核。</p></div></div><div id="planCards" class="plan-cards"></div><form id="membershipForm" class="membership-form"><label>申请等级<select name="targetPlanCode" id="targetPlanCode" required></select></label><label>联系人<input name="contactName" id="upgradeContactName" required></label><label>联系电话<input name="contactPhone" id="upgradeContactPhone" required></label><label class="wide">申请说明<textarea name="note" rows="3" placeholder="可填写开通时间、业务需求等"></textarea></label><button type="submit">提交会员升级申请</button></form><div id="membershipHistory" class="membership-history"></div></section></div>
  </main>

  <div class="profile-modal-overlay" id="profileModal"><section class="profile-modal"><header><h2 id="profileModalTitle">我的资料</h2><button data-close-modal>×</button></header><form id="profileForm"><div id="ownerProfileFields"><div class="profile-logo-row wide"><span class="profile-logo-preview" id="shipyardLogoPreview">厂</span><div><strong>厂家图标</strong><small>支持 PNG、JPEG、WebP，文件不超过 2MB</small><button type="button" class="ghost" id="selectShipyardLogo">选择并上传</button><input type="file" id="shipyardLogoFile" accept=".png,.jpg,.jpeg,.webp" hidden></div></div><label>厂家名称<input name="shipyardName"></label><label>联系人<input name="contactName"></label><label>厂家电话<input name="contactPhone"></label><label class="wide">地址<input name="address"></label><label class="wide">业务范围<input name="businessScope"></label><label class="wide">厂家简介<textarea name="description" rows="3"></textarea></label></div><div id="personalProfileFields"><label>姓名<input name="displayName"></label><label>个人电话<input name="phone"></label><label class="wide">头像地址<input name="avatarUrl" placeholder="可暂时留空"></label></div><footer><button type="button" class="ghost" data-close-modal>取消</button><button type="submit">保存资料</button></footer></form></section></div>
  <div class="profile-modal-overlay" id="passwordModal"><section class="profile-modal profile-modal--small"><header><h2>修改密码</h2><button data-close-modal>×</button></header><form id="passwordForm"><label>当前密码<input name="currentPassword" type="password" required></label><label>新密码<input name="newPassword" type="password" required placeholder="6-18位，至少两种字符"></label><label>确认新密码<input name="confirmPassword" type="password" required></label><footer><button type="button" class="ghost" data-close-modal>取消</button><button type="submit">确认修改</button></footer></form></section></div>
  <div class="shipyard-toast" id="shipyardToast"></div>
  <script src="js/shipyard.js"></script>
</body>
</html>
